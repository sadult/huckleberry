name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          for f in background.js sidebar/sidebar.js options/options.js content/*.js ai/*.js; do
            node --check "$f"
          done

      - name: Validate manifests
        run: python3 -c "import json;[json.load(open(f)) for f in ('manifest.json','manifest.chrome.json')]"

      - name: Verify the UI is English-only
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if p.is_dir() or '.git' in p.parts or 'dist' in p.parts:
                  continue
              if p.suffix not in {'.js', '.html', '.css', '.json', '.md'}:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'[\u0600-\u06FF]', text):
                  bad.append(str(p))
          if bad:
              print('Non-English characters found in:', *bad, sep='\n  ')
              sys.exit(1)
          print('English-only check passed')
          PY

      - name: Build packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: huckleberry-packages
          path: dist/*.zip
